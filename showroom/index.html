<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#150e17">
  <title>Alhelí Residencias | Showroom</title>
  <meta name="description" content="Recorra Alhelí Residencias: fachada, accesos, patio central, plantas y departamentos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap">
  <link rel="preload" as="image" href="assets/img/aerial-0-sm.jpg" media="(max-width: 1100px)">
  <link rel="preload" as="image" href="assets/img/aerial-0.jpg" media="(min-width: 1101px)">
  <link rel="preload" as="image" href="assets/plan3d/floor-pb-sm.jpg" media="(max-width: 1100px)">
  <link rel="stylesheet" href="showroom.css">
  <script src="data.js" defer></script>
  <script src="showroom.js" defer></script>
</head>
<body>
<main class="sr" id="sr" data-mode="stage">

  <!-- Escena: render actual, capa de video de transición y zonas interactivas -->
  <div class="scene" id="scene">
    <img class="layer still" id="still" alt="" draggable="false">
    <img class="layer still next" id="stillNext" alt="" draggable="false" aria-hidden="true">
    <video class="layer clip" id="clip" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
    <svg class="layer zones" id="zones" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Zonas interactivas"></svg>
    <div class="layer pins" id="pins"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Barra superior -->
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><span class="bn">Alhelí <em>Residencias</em></span></div>
    <div class="top-actions">
      <button class="pill" id="openPlans" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8v6H3zM13 5h8v14h-8zM3 13h8v6H3z"/></svg><span>Plantas</span></button>
      <button class="pill" id="openList" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Departamentos</span></button>
      <button class="icon" id="fullBtn" type="button" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <!-- Título de la vista -->
  <div class="caption" id="caption"><p class="eyebrow" id="capKind"></p><h1 id="capName"></h1><p class="hint" id="capHint"></p></div>

  <!-- Navegación entre vistas -->
  <button class="edge prev" id="prevBtn" type="button" aria-label="Vista anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="edge next" id="nextBtn" type="button" aria-label="Vista siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <nav class="strip" id="strip" aria-label="Vistas del recorrido"></nav>

  <div class="tip" id="tip" role="status" aria-hidden="true"></div>

  <!-- Modo planta: render cenital a pantalla completa con las unidades sobre la escena -->
  <section class="floor" id="floor" aria-label="Planta" hidden>
    <div class="floor-stage" id="floorStage">
      <div class="floor-canvas" id="floorCanvas">
        <img id="floorImg" alt="" draggable="false">
        <svg id="floorSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Departamentos"></svg>
        <div class="floor-labels" id="floorLabels"></div>
      </div>
    </div>
    <div class="floor-bar">
      <button class="icon" id="floorBack" type="button" aria-label="Volver a la vista exterior" title="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <div class="floor-title"><p class="eyebrow">Alhelí Residencias</p><h2 id="floorName"></h2></div>
    </div>
    <div class="floor-tools">
      <div class="seg" id="floorSel" role="tablist" aria-label="Planta"></div>
      <div class="seg" id="floorMode" role="tablist" aria-label="Tipo de vista">
        <button type="button" data-mode="3d" class="on" aria-pressed="true" title="Vista 3D"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
        <button type="button" data-mode="2d" aria-pressed="false" title="Plano"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      </div>
    </div>
    <div class="zoom">
      <button class="icon" id="zoomIn" type="button" aria-label="Acercar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
      <button class="icon" id="zoomOut" type="button" aria-label="Alejar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M8 11h6"/></svg></button>
    </div>
    <div class="legend floor-legend"><span><i class="st-disponible"></i>Disponible</span><span><i class="st-reservado"></i>Reservado</span><span><i class="st-vendido"></i>Vendido</span></div>
  </section>

  <!-- Tarjeta inferior: entrar a una planta desde la fachada, o resumen de la unidad elegida -->
  <div class="card-sheet" id="cardSheet" role="dialog" aria-live="polite" hidden>
    <div class="card-body" id="cardBody"></div>
  </div>

  <!-- Lista de departamentos -->
  <section class="sheet list" id="list" aria-label="Departamentos" hidden>
    <div class="sheet-head">
      <h2>Departamentos</h2>
      <div class="filters" id="filters">
        <button class="chip on" data-f="all" type="button">Todos</button>
        <button class="chip" data-f="1" type="button">1 dorm.</button>
        <button class="chip" data-f="2" type="button">2 dorm.</button>
        <button class="chip" data-f="3" type="button">3 dorm.</button>
      </div>
      <button class="icon close" data-close type="button" aria-label="Cerrar lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- Ficha de departamento -->
  <aside class="unit" id="unit" aria-label="Ficha del departamento" hidden>
    <button class="icon close" data-close-unit type="button" aria-label="Cerrar ficha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="unitBody"></div>
  </aside>

  <!-- Visor de interiores -->
  <section class="viewer" id="viewer" aria-label="Interiores" hidden>
    <img id="viewerImg" alt="">
    <div class="viewer-cap"><p class="eyebrow">Interior · imagen referencial</p><h2 id="viewerName"></h2></div>
    <div class="viewer-thumbs" id="viewerThumbs"></div>
    <button class="icon close" data-close-viewer type="button" aria-label="Cerrar interiores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </section>

  <div class="loading" id="loading" aria-hidden="true"><span></span></div>
</main>
</body>
</html>
