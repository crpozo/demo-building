name: Desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - name: Preparar llavero de firma (solo Mac, si existe el secreto)
        if: runner.os == 'macOS' && env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
          P12_B64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/signing.keychain-db"; KPASS="$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -sSLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -sSLo "$RUNNER_TEMP/DeveloperIDCA.cer" https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          curl -sSLo "$RUNNER_TEMP/AppleRootCA-G2.cer" https://www.apple.com/certificateauthority/AppleRootCA-G2.cer
          security create-keychain -p "$KPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASS" -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" -A || true
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KC" -A || true
          security import "$RUNNER_TEMP/AppleRootCA-G2.cer" -k "$KC" -A || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/AppleRootCA-G2.cer" || true
          sudo security add-trusted-cert -d -r trustAsRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true
          security find-identity -v -p codesigning "$KC"
          echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_NAME: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'Developer ID Application' || '' }}
          # Firma y notarización de Apple: se activan solas cuando existen estos secretos en el repositorio.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      - name: Version
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: alheli-showroom-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Alhelí Showroom ${{ steps.v.outputs.tag }}
          body: Instalador del showroom 3D de Alhelí. En Mac, la primera vez abrir con clic derecho → Abrir.
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
