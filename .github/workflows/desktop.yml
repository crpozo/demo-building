name: Desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - name: Importar certificado Developer ID (solo Mac, si existe el secreto)
        if: runner.os == 'macOS' && env.HAS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      - name: Instalar certificados intermedios de Apple (Developer ID CA)
        if: runner.os == 'macOS'
        run: |
          curl -sSLo DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          curl -sSLo DeveloperIDCA.cer https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          curl -sSLo AppleRootCA-G2.cer https://www.apple.com/certificateauthority/AppleRootCA-G2.cer
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain AppleRootCA-G2.cer
          sudo security add-trusted-cert -d -r trustAsRoot -k /Library/Keychains/System.keychain DeveloperIDG2CA.cer
          sudo security add-trusted-cert -d -r trustAsRoot -k /Library/Keychains/System.keychain DeveloperIDCA.cer
          security find-identity -v -p codesigning
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_NAME: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'Developer ID Application' || '' }}
          # Firma y notarización de Apple: se activan solas cuando existen estos secretos en el repositorio.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      - name: Version
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: alheli-showroom-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Alhelí Showroom ${{ steps.v.outputs.tag }}
          body: Instalador del showroom 3D de Alhelí. En Mac, la primera vez abrir con clic derecho → Abrir.
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
